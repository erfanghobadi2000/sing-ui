name: Build Sing-UI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Verify submodules
        run: |
          test -f upstream/s-ui/main.go
          test -f upstream/s-ui/frontend/package.json
      - name: Apply Sing-UI theme
        run: bash scripts/apply-theme.sh
      - name: Build
        run: bash scripts/build.sh
